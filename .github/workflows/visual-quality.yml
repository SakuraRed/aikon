name: Image quality gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/visual-quality.yml'
      - 'requirements-ci.txt'
      - 'skills/aikon/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/validation/paint-fields/**'
      - 'docs/validation/quality-v3/artwork-verdicts.json'
      - 'docs/validation/edges-v3/run_audit.py'
      - 'docs/validation/edges-v3/fixtures/**'
      - 'docs/validation/edges-v3/positive-calibration/summary.json'
      - 'ref/**'
      - 'outputs/calibration/illustration/*-imagegen-*.png'
      - 'outputs/fixtures/**/round-002/**'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/visual-quality.yml'
      - 'requirements-ci.txt'
      - 'skills/aikon/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/validation/paint-fields/**'
      - 'docs/validation/quality-v3/artwork-verdicts.json'
      - 'docs/validation/edges-v3/run_audit.py'
      - 'docs/validation/edges-v3/fixtures/**'
      - 'docs/validation/edges-v3/positive-calibration/summary.json'
      - 'ref/**'
      - 'outputs/calibration/illustration/*-imagegen-*.png'
      - 'outputs/fixtures/**/round-002/**'

permissions:
  contents: read

concurrency:
  group: visual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout audited revision
        timeout-minutes: 2
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up CPython
        timeout-minutes: 2
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # One fixed quality baseline. Local development OS is not a CI matrix.
          python-version: '3.13.3'
          architecture: x64
      - name: Install verified binary dependencies
        id: dependencies
        timeout-minutes: 2
        run: >-
          python -c "import sys; from tools.run_visual_e2e import run_bounded; sys.exit(run_bounded([sys.executable,'-m','pip','install','--disable-pip-version-check','--require-hashes','--only-binary=:all:','--timeout','15','--retries','0','-r','requirements-ci.txt'],timeout=50))"
      - name: Test image-quality detectors
        timeout-minutes: 2
        run: python -B tools/run_image_quality.py --mode tests --output .local/quality
      - name: Audit real references and rejected examples
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 2
        # Each entrypoint supervises its own bounded worker/process tree.
        # Control success never accepts the user-rejected round-002 artwork.
        run: python -B tools/run_image_quality.py --mode audit --output .local/quality
      - name: Keep visual evidence even after failure
        id: evidence_artifact
        timeout-minutes: 2
        if: always()
        # Account-level artifact quota must not hide otherwise completed checks.
        # The following summary/log step still records actual pixel hashes.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-quality-evidence
          path: .local/quality/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
      - name: Publish detector results and human verdicts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 1
        run: >-
          python -B tools/run_image_quality.py --mode summary --output .local/quality --artifact-outcome ${{ steps.evidence_artifact.outcome }}

name: SVG visual quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/visual-quality.yml'
      - 'requirements-ci.txt'
      - 'skills/aikon/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/validation/paint-fields/**'
      - 'ref/**'
      - 'outputs/calibration/illustration/*-imagegen-*.png'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/visual-quality.yml'
      - 'requirements-ci.txt'
      - 'skills/aikon/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/validation/paint-fields/**'
      - 'ref/**'
      - 'outputs/calibration/illustration/*-imagegen-*.png'

permissions:
  contents: read

concurrency:
  group: visual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-contract:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout audited revision
        timeout-minutes: 2
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up CPython
        timeout-minutes: 2
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # Match the locally verified CPython ABI and patch version. The
          # official python-versions manifest has both Linux 24.04 and Win x64.
          python-version: '3.13.3'
          architecture: x64
      - name: Install verified binary dependencies
        id: dependencies
        timeout-minutes: 2
        run: >-
          python -c "import sys; from tools.run_visual_e2e import run_bounded; sys.exit(run_bounded([sys.executable,'-m','pip','install','--disable-pip-version-check','--require-hashes','--only-binary=:all:','--timeout','15','--retries','0','-r','requirements-ci.txt'],timeout=50))"
      - name: Run contract and raster tests
        timeout-minutes: 2
        run: >-
          python -c "import sys; from tools.run_visual_e2e import run_bounded; sys.exit(run_bounded([sys.executable,'-B','-m','unittest','discover','-s','tests','-v'],timeout=50))"
      - name: Render and diagnose controlled visual cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 2
        # The entrypoint itself calls run_bounded, allowing cleanup to finish
        # without a competing outer subprocess timeout killing its supervisor.
        run: python -B tools/run_visual_e2e.py --output .local/e2e
      - name: Keep visual evidence even after failure
        id: evidence_artifact
        timeout-minutes: 2
        if: always()
        # Account-level artifact quota must not hide otherwise completed checks.
        # The following summary/log step still records actual pixel hashes.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: svg-evidence-${{ matrix.os }}
          path: .local/e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
      - name: Publish durable audit summary and pixel hashes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 1
        run: >-
          python -B tools/write_ci_evidence.py --input .local/e2e --artifact-upload-outcome ${{ steps.evidence_artifact.outcome }}

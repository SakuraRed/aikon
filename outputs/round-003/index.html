<!doctype html>
<html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aikon · 第三轮审阅</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1b2430;background:#eef1f5;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1800px;margin-inline:auto}h1{font-size:28px;margin:0 0 10px}p{line-height:1.7;max-width:1000px}header{margin-bottom:24px}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0}button,select{font:inherit;padding:9px 13px;border:1px solid #bec8d4;border-radius:7px;background:#fff;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#233549;color:white}section{margin:28px 0}h2{font-size:20px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.grid.pair{grid-template-columns:repeat(2,minmax(0,1fr));max-width:900px}article{background:#fff;border:1px solid #ced6df;border-radius:12px;overflow:hidden}.art{aspect-ratio:1;display:grid;place-items:center;background-color:#fafafa;background-image:linear-gradient(45deg,#e6e9ed 25%,transparent 25%),linear-gradient(-45deg,#e6e9ed 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e9ed 75%),linear-gradient(-45deg,transparent 75%,#e6e9ed 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.art img{width:100%;height:100%;object-fit:contain;max-height:640px}.info{padding:14px}.info h3{font-size:16px;margin:0 0 8px}.info a{display:inline-block;margin-right:12px;color:#194a8b;text-underline-offset:3px}.note{color:#5e6977;font-size:13px}.light .art{background:#fff}.dark .art{background:#161b24}.neutral .art{background:#a9b0bb}.tiny .art img{width:128px;height:128px;max-width:100%}.tiny .art{min-height:160px;aspect-ratio:auto}.hidden{display:none}footer{margin:36px 0 12px;border-top:1px solid #cbd4de;padding-top:18px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){body{padding:16px}.grid,.grid.pair{grid-template-columns:1fr}h1{font-size:24px}}
</style>
<header><h1>Aikon · 第三轮审阅</h1><p>全部图标为透明背景 SVG。棋盘格、浅底与深底只用于这里的预览。精简版聚焦头像，完整版包含独立设计的颈领和上胸；男女管理员分别提供戴面具与不戴面具两种版本。</p><p class="note">当前均为审计候选，尚未获用户接受。DeepSeek 精简版未达到选定的严格 B 数值合同；管理员的边缘与眼形检查通过不代表完整材质或视觉验收通过。</p></header>
<nav aria-label="预览显示"><span>展示底色</span><button data-bg="checker" aria-pressed="true">棋盘格</button><button data-bg="light" aria-pressed="false">浅色</button><button data-bg="dark" aria-pressed="false">深色</button><button data-bg="neutral" aria-pressed="false">中灰</button><label>尺寸 <select id="size"><option value="large">随窗口放大</option><option value="tiny">128 像素</option></select></label><label>版本 <select id="profile"><option value="both">同时查看</option><option value="short">仅精简版</option><option value="full">仅完整版</option></select></label></nav>
<main id="gallery"></main>
<footer><p>修改反馈可注明：主体、面具分支、精简/完整、要保留的部分，以及需要调整的位置。SVG 链接指向当前审计版本；旧稿、实际提示词和源码保存在各主体的 revisions 目录。</p><a href="../../docs/validation/r1-numeric-contract-b.json">R1 已选数值合同</a> · <a href="../../docs/validation/2026-09-29-contract-outfit-answers.json">本轮真实选择记录</a></footer>
<script>
const groups=[{name:'DeepSeek · R1 身份',dir:'deepseek',items:[['short','精简版','short.svg'],['full','完整版 · A 蓝白女仆衣装','full.svg']]},{name:'女管理员',dir:'endministrator-female',items:[['short','不戴面具 · 精简','unmasked/short.svg'],['full','不戴面具 · 完整','unmasked/full.svg'],['short','戴面具 · 精简','masked/short.svg'],['full','戴面具 · 完整','masked/full.svg']]},{name:'男管理员',dir:'endministrator-male',items:[['short','不戴面具 · 精简','unmasked/short.svg'],['full','不戴面具 · 完整','unmasked/full.svg'],['short','戴面具 · 精简','masked/short.svg'],['full','戴面具 · 完整','masked/full.svg']]}];
for(const group of groups){const section=document.createElement('section');const title=document.createElement('h2');title.textContent=group.name;section.append(title);const grid=document.createElement('div');grid.className='grid'+(group.items.length===2?' pair':'');for(const [profile,label,file]of group.items){const card=document.createElement('article');card.dataset.profile=profile;const art=document.createElement('div');art.className='art';const img=document.createElement('img');img.src=group.dir+'/'+file;img.alt=group.name+'，'+label;art.append(img);const info=document.createElement('div');info.className='info';const h=document.createElement('h3');h.textContent=label;const a=document.createElement('a');a.href=img.src;a.textContent='打开 SVG';a.target='_blank';const dl=document.createElement('a');dl.href=img.src;dl.download=group.dir+'-'+file.replaceAll('/','-');dl.textContent='下载 SVG';info.append(h,a,dl);card.append(art,info);grid.append(card)}section.append(grid);document.querySelector('#gallery').append(section)}
document.querySelectorAll('[data-bg]').forEach(button=>button.onclick=()=>{document.body.classList.remove('light','dark','neutral');if(button.dataset.bg!=='checker')document.body.classList.add(button.dataset.bg);document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))});
document.querySelector('#size').onchange=e=>document.body.classList.toggle('tiny',e.target.value==='tiny');document.querySelector('#profile').onchange=e=>document.querySelectorAll('article').forEach(card=>card.classList.toggle('hidden',e.target.value!=='both'&&card.dataset.profile!==e.target.value));
</script></html>
